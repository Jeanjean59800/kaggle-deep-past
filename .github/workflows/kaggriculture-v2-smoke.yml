name: Kaggriculture V2 quick smoke

on:
  push:
    branches:
      - scratch/kaggriculture-v2-20260815
    paths:
      - '.tmp_kaggriculture/smoke_v2.py'
      - '.github/workflows/kaggriculture-v2-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact engine and statistics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
          python -m pip install 'git+https://github.com/Kaggle/kaggle-environments.git@28b6d8af3ce73926b3d0fda1410c1ddd8384ab8c'
      - name: Assemble benchmark source
        run: |
          cat \
            .tmp_kaggriculture/benchmark_v2.part00 \
            .tmp_kaggriculture/benchmark_v2.part01a \
            .tmp_kaggriculture/benchmark_v2.part01b \
            .tmp_kaggriculture/benchmark_v2.part02a \
            .tmp_kaggriculture/benchmark_v2.part02b \
            > .tmp_kaggriculture/benchmark_v2.py
          sed -i 's/range(5)/range(6)/' .tmp_kaggriculture/benchmark_v2.py
          python -m py_compile .tmp_kaggriculture/benchmark_v2.py .tmp_kaggriculture/smoke_v2.py
      - name: Run live smoke ranking
        env:
          PYTHONHASHSEED: '0'
          BENCH_WORKERS: '4'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python .tmp_kaggriculture/smoke_v2.py
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-v2-smoke-${{ github.run_id }}
          path: .tmp_kaggriculture/out_v2_smoke
          if-no-files-found: warn
          retention-days: 2
