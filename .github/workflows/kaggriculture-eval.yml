name: Kaggriculture diverse-opponent league

on:
  push:
    branches:
      - scratch/kaggriculture-league-20260815
    paths:
      - '.tmp_kaggriculture/**'
      - '.github/workflows/kaggriculture-eval.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned environment and statistics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
          python -m pip install 'git+https://github.com/Kaggle/kaggle-environments.git@2f22627ff7def9fc23d57bebcab184476153c678'
      - name: Run diverse-opponent league
        env:
          PYTHONHASHSEED: '0'
          BENCH_WORKERS: '4'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python .tmp_kaggriculture/benchmark_league.py
      - name: Upload league artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-league-${{ github.run_id }}
          path: .tmp_kaggriculture/out_league
          if-no-files-found: warn
          retention-days: 2
